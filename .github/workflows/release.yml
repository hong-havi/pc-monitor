name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install PyQt6 psutil pywin32 wmi pythonnet pyinstaller

      - name: Download libraries
        run: |
          mkdir lib\lhm
          curl -sL "https://www.nuget.org/api/v2/package/LibreHardwareMonitorLib/0.9.4" -o lib\lhm.nupkg.zip
          tar -xf lib\lhm.nupkg.zip -C lib\lhm
          del lib\lhm.nupkg.zip

          mkdir lib\hidsharp
          curl -sL "https://www.nuget.org/api/v2/package/HidSharp/2.1.0" -o lib\hidsharp.nupkg.zip
          tar -xf lib\hidsharp.nupkg.zip -C lib\hidsharp
          del lib\hidsharp.nupkg.zip

          mkdir lib\lhm-096
          curl -sL "https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/download/v0.9.6/LibreHardwareMonitor-net472.zip" -o lib\lhm-096.zip
          tar -xf lib\lhm-096.zip -C lib\lhm-096
          del lib\lhm-096.zip
        shell: cmd

      - name: Build exe
        run: |
          python -m PyInstaller ^
            --onefile ^
            --windowed ^
            --name "PCMonitor" ^
            --paths src ^
            --add-data "lib/lhm-096;lhm" ^
            --add-data "lib/lhm/lib/net472;lib" ^
            --add-data "lib/hidsharp/lib/net35;lib" ^
            --hidden-import wmi ^
            --hidden-import pythoncom ^
            --hidden-import win32com ^
            --hidden-import clr ^
            --hidden-import clr_loader ^
            --distpath dist ^
            --workpath build/PCMonitor ^
            --specpath . ^
            -y ^
            src/main.py
        shell: cmd

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PCMonitor.exe
          generate_release_notes: true
